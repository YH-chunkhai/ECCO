name: ecco_steel_quotation
description: Official ECCO Steel Mesh Quotation Generator Flutter App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  share_plus: ^10.0.0
  path_provider: ^2.1.2
  gal: ^2.3.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/ecco_steel_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/ecco_steel_logo.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/images/ecco_steel_logo.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/images/ecco_steel_logo.png
    - ecco_logo.png

